<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor 80 任务数据看板</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--muted:#6a7385;--line:#e3e6ec;--accent:#2f5bea;--ok:#2e9e6a;--bad:#d64545;--warn:#c98a1b;--chip:#eef1f7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
header{padding:18px 24px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px}
header .sub{color:var(--muted);font-size:12px;margin-top:4px;word-break:break-all}
main{max-width:1280px;margin:0 auto;padding:18px 24px 40px}
.alert{background:#fdecec;border:1px solid #f1b9b9;border-left:5px solid var(--bad);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.alert b{color:var(--bad)}
.alert small{display:block;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{color:var(--muted);font-size:12px}
.kpi.bad .v{color:var(--bad)}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:14px}
.card .hint{color:var(--muted);font-size:12px;margin:-4px 0 8px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.bar-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row.click{cursor:pointer}
.bar-row.click:hover .name{color:var(--accent)}
.track{display:flex;height:16px;background:var(--chip);border-radius:4px;overflow:hidden}
.seg{height:100%}
.seg.ok{background:var(--ok)}.seg.bad{background:var(--bad)}.seg.acc{background:var(--accent)}
.num{text-align:right;color:var(--muted)}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:32px;background:var(--card);border-radius:50%}
.legend div{margin:4px 0;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.hist{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.hist .b{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.hist .x{margin-top:4px;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;user-select:none}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:#f0f4ff}
.tablewrap{overflow-x:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;min-height:34px}
.toolbar input{flex:1;min-width:200px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:var(--chip)}
.pill.bad{background:#fdecec;color:var(--bad)}.pill.ok{background:#e6f5ed;color:var(--ok)}
.q{max-width:560px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:31;padding:20px;overflow:auto;transform:translateX(100%);transition:transform .2s;box-shadow:-4px 0 20px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.drawer h3{margin:0 0 4px;font-size:16px}
.drawer .lab{margin:14px 0 4px;color:var(--muted);font-size:12px;font-weight:600}
.drawer pre{white-space:pre-wrap;word-break:break-word;background:var(--chip);padding:10px;border-radius:6px;margin:0;font:inherit}
.drawer .x{position:absolute;top:10px;right:14px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted)}
.drawer a{color:var(--accent);word-break:break-all}
.drawer li{margin:3px 0}
@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:14px}.bar-row{grid-template-columns:110px minmax(0,1fr) 34px}}

</style>
</head>

<script>
(function () {
  "use strict";
  const D = HARBOR_DATA, T = D.tasks;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const mb = (b) => (b / 1048576).toFixed(b >= 10485760 ? 0 : 1) + " MB";
  const kb = (b) => (b >= 1048576 ? mb(b) : Math.max(1, Math.round(b / 1024)) + " KB");

  T.forEach((t) => {
    t.total = t.files.reduce((a, f) => a + f.size, 0);
    t.dataFiles = t.files.filter((f) => f.name !== "README.docx");
    t.ansKind = t.refEmpty ? "empty" : t.numeric ? "num" : "text";
  });
  const empty = T.filter((t) => t.refEmpty).length;
  const state = { q: "", fam: "", ans: "", sort: { k: "id", dir: 1 } };

  function groupBy(arr, fn) {
    const m = new Map();
    arr.forEach((x) => { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
    return m;
  }
  const families = [...groupBy(T, (t) => t.family)].map(([name, ts]) => ({
    name, ts, n: ts.length, empty: ts.filter((t) => t.refEmpty).length,
    files: [...new Set(ts.flatMap((t) => t.dataFiles.map((f) => f.name)))],
    size: Math.max(...ts.map((t) => t.total)),
    urls: [...new Set(ts.flatMap((t) => t.urls))]
  })).sort((a, b) => b.n - a.n);

  function bars(rows, opts) {
    const max = Math.max(...rows.map((r) => r.total));
    return rows.map((r) => {
      const segs = r.segs.map((s) => `<div class="seg ${s.cls}" style="width:${(s.v / max) * 100}%"><\/div>`).join("");
      return `<div class="bar-row ${opts && opts.click ? "click" : ""}" data-key="${esc(r.name)}">
        <div class="name" title="${esc(r.name)}">${esc(r.name)}<\/div><div class="track">${segs}<\/div><div class="num">${r.total}<\/div><\/div>`;
    }).join("");
  }

  function hist(vals, edges, fmt) {
    const cnt = edges.map(() => 0);
    vals.forEach((v) => { let i = edges.length - 1; while (i > 0 && v < edges[i]) i--; cnt[i]++; });
    const max = Math.max(...cnt);
    return `<div class="hist">${cnt.map((c, i) => `<div class="col"><span>${c}<\/span><div class="b" style="height:${(c / max) * 100}%"><\/div><span class="x">${fmt(edges[i], edges[i + 1])}<\/span><\/div>`).join("")}<\/div>`;
  }

  function renderTop() {
    $("sub").textContent = `数据源 ${D.source} · 看板数据生成于 ${D.generated} · 静态快照，不含模型运行结果`;
    $("alert").innerHTML = empty ? `<div class="alert"><b>数据质量提示：${empty} / ${T.length} 个任务的 reference_answer.txt 为空（0 字节）<\/b>
      <small>这些任务的 solution/answer.txt 同样为空。按 tests/grade.py 的逻辑，参考答案为空时无论提交什么答案得分都是 0（已用空参考答案实测：提交 "0"、"California"、"12,079"、空串，reward 均为 0.0）。使用这批任务评测前需先补全参考答案。<\/small><\/div>` : "";
    const totalFiles = T.reduce((a, t) => a + t.files.length, 0);
    const totalSize = T.reduce((a, t) => a + t.total, 0);
    const kp = [
      ["任务总数", T.length, ""], ["数据集家族", families.length, ""],
      ["参考答案为空", empty, "bad click\" data-act=\"empty"],
      ["有参考答案", T.length - empty, ""],
      ["参考文件总数", totalFiles, ""], ["文件总体积", mb(totalSize), ""]
    ];
    $("kpis").innerHTML = kp.map(([l, v, c]) => `<div class="kpi ${c}"><div class="v">${v}<\/div><div class="l">${l}<\/div><\/div>`).join("");
  }

  function renderCharts() {
    const famRows = families.map((f) => ({ name: f.name, total: f.n, segs: [{ v: f.n - f.empty, cls: "ok" }, { v: f.empty, cls: "bad" }] }));
    const kinds = { num: 0, text: 0, empty: 0 };
    T.forEach((t) => kinds[t.ansKind]++);
    const cols = { num: "#2f5bea", text: "#2e9e6a", empty: "#d64545" };
    let acc = 0;
    const stops = Object.keys(kinds).map((k) => { const s = acc; acc += (kinds[k] / T.length) * 100; return `${cols[k]} ${s}% ${acc}%`; }).join(",");
    const lab = { num: "数值型答案", text: "文本型答案", empty: "参考答案为空" };
    const ext = {};
    T.forEach((t) => t.files.forEach((f) => { ext[f.ext] = (ext[f.ext] || 0) + 1; }));
    const extRows = Object.entries(ext).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ name: "." + k, total: v, segs: [{ v, cls: "acc" }] }));
    const nf = {};
    T.forEach((t) => { nf[t.files.length] = (nf[t.files.length] || 0) + 1; });
    const nfRows = Object.entries(nf).map(([k, v]) => ({ name: k + " 个文件", total: v, segs: [{ v, cls: "acc" }] }));

    $("charts").innerHTML = `
      <div class="card"><h2>各数据集家族任务数<\/h2><div class="hint">绿 = 有参考答案，红 = 参考答案为空；点击一行筛选下方明细<\/div>${bars(famRows, { click: true })}<\/div>
      <div class="card"><h2>参考答案状态<\/h2><div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"><\/div>
        <div class="legend">${Object.keys(kinds).map((k) => `<div><span class="dot" style="background:${cols[k]}"><\/span>${lab[k]}：${kinds[k]}（${Math.round(kinds[k] / T.length * 100)}%）<\/div>`).join("")}<\/div><\/div>
        <div class="hint" style="margin-top:10px">数值型 = 整串为数字/百分号；其余非空答案归为文本型<\/div><\/div>
      <div class="card"><h2>参考文件类型（文件数，含每任务 README.docx）<\/h2>${bars(extRows)}<\/div>
      <div class="card"><h2>每任务参考文件数<\/h2>${bars(nfRows)}<\/div>
      <div class="card"><h2>题面长度分布（字符数）<\/h2>${hist(T.map((t) => t.qlen), [0, 100, 200, 300, 400, 500, 600], (a, b) => (b ? a + "-" + b : a + "+"))}<\/div>
      <div class="card"><h2>每任务参考文件体积<\/h2>${hist(T.map((t) => t.total / 1048576), [0, 0.1, 0.5, 1, 5, 20], (a, b) => (b ? a + "-" + b + "MB" : a + "MB+"))}<\/div>`;
  }

  function renderFamilies() {
    const dom = (u) => { try { return new URL(u).hostname; } catch (e) { return u; } };
    $("famTable").innerHTML = `<thead><tr><th>数据集<\/th><th>任务数<\/th><th>答案为空<\/th><th>数据文件<\/th><th>最大体积<\/th><th>README 来源域名<\/th><\/tr><\/thead><tbody>` +
      families.map((f) => `<tr><td><b>${esc(f.name)}<\/b><\/td><td>${f.n}<\/td>
        <td>${f.empty ? `<span class="pill bad">${f.empty}<\/span>` : `<span class="pill ok">0<\/span>`}<\/td>
        <td>${f.files.map(esc).join("<br>")}<\/td><td>${kb(f.size)}<\/td>
        <td>${[...new Set(f.urls.map(dom))].map(esc).join("<br>") || "—"}<\/td><\/tr>`).join("") + `<\/tbody>`;
  }

  function setupFilters() {
    $("fFamily").innerHTML = `<option value="">全部数据集<\/option>` + families.map((f) => `<option value="${esc(f.name)}">${esc(f.name)}（${f.n}）<\/option>`).join("");
    $("q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); renderTasks(); });
    $("fFamily").addEventListener("change", (e) => { state.fam = e.target.value; renderTasks(); });
    $("fAns").addEventListener("change", (e) => { state.ans = e.target.value; renderTasks(); });
  }

  function setFilter(fam, ans) {
    state.fam = fam; state.ans = ans;
    $("fFamily").value = fam; $("fAns").value = ans;
    renderTasks();
    $("taskTable").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  const COLS = [
    ["id", "任务 ID"], ["question", "题面"], ["family", "数据集"], ["ref", "参考答案"],
    ["nfiles", "文件数"], ["total", "体积"], ["qlen", "题面字数"]
  ];

  function sortVal(t, k) {
    if (k === "nfiles") return t.files.length;
    return t[k];
  }

  function renderTasks() {
    const s = state;
    let rows = T.filter((t) =>
      (!s.fam || t.family === s.fam) && (!s.ans || t.ansKind === s.ans) &&
      (!s.q || (t.question + " " + t.ref + " " + t.id + " " + t.files.map((f) => f.name).join(" ")).toLowerCase().includes(s.q)));
    const { k, dir } = s.sort;
    rows.sort((a, b) => {
      const x = sortVal(a, k), y = sortVal(b, k);
      return (x < y ? -1 : x > y ? 1 : 0) * dir;
    });
    $("count").textContent = `${rows.length} / ${T.length}`;
    const arrow = (c) => (c === k ? (dir > 0 ? " ▲" : " ▼") : "");
    $("taskTable").innerHTML = `<thead><tr>${COLS.map(([c, l]) => `<th data-k="${c}">${l}${arrow(c)}<\/th>`).join("")}<\/tr><\/thead><tbody>` +
      rows.map((t) => `<tr class="row" data-id="${t.id}"><td>${t.id}<\/td><td class="q">${esc(t.question.length > 150 ? t.question.slice(0, 150) + "…" : t.question)}<\/td>
        <td>${esc(t.family)}<\/td><td>${t.refEmpty ? `<span class="pill bad">空<\/span>` : esc(t.ref)}<\/td>
        <td>${t.files.length}<\/td><td>${kb(t.total)}<\/td><td>${t.qlen}<\/td><\/tr>`).join("") + `<\/tbody>`;
  }

  function openDrawer(id) {
    const t = T.find((x) => x.id === id);
    const files = t.files.map((f) => `<li>${esc(f.name)} · ${kb(f.size)}${f.sheets ? ` · ${f.sheets} 个工作表` : ""}<\/li>`).join("");
    const urls = t.urls.length ? t.urls.map((u) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}<\/a><\/li>`).join("") : "<li>无<\/li>";
    $("drawer").innerHTML = `<button class="x" id="dx">×<\/button><h3>任务 ${t.id}<\/h3>
      <div><span class="pill">${esc(t.family)}<\/span> ${t.refEmpty ? `<span class="pill bad">参考答案为空<\/span>` : `<span class="pill ok">有参考答案<\/span>`}<\/div>
      <div class="lab">题面<\/div><pre>${esc(t.question)}<\/pre>
      <div class="lab">参考答案（tests/reference_answer.txt）<\/div><pre>${t.refEmpty ? "（空，0 字节）" : esc(t.ref)}<\/pre>
      <div class="lab">参考文件（${t.files.length}）<\/div><ul>${files}<\/ul>
      <div class="lab">README 中的来源链接<\/div><ul>${urls}<\/ul>
      <div class="lab">目录<\/div><pre>${esc(t.dir)}<\/pre>`;
    $("drawer").classList.add("open"); $("ov").style.display = "block";
  }
  function closeDrawer() { $("drawer").classList.remove("open"); $("ov").style.display = "none"; }

  document.addEventListener("click", (e) => {
    const el = e.target;
    const th = el.closest("th[data-k]");
    if (th && th.closest("#taskTable")) {
      const k = th.dataset.k;
      state.sort.dir = state.sort.k === k ? -state.sort.dir : 1; state.sort.k = k; return renderTasks();
    }
    const tr = el.closest("tr.row");
    if (tr) return openDrawer(tr.dataset.id);
    const br = el.closest(".bar-row.click");
    if (br) return setFilter(br.dataset.key, "");
    if (el.closest("[data-act=empty]")) return setFilter("", "empty");
    if (el.id === "dx" || el.id === "ov") closeDrawer();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  renderTop(); renderCharts(); renderFamilies(); setupFilters(); renderTasks();
})();

</script>
</body>
</html>
