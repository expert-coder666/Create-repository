<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>科目一笔记速查卡</title>
<style>
:root{
  --bg:#f2f4f7;--card:#fff;--fg:#1b2430;--mut:#5d6b7a;--bd:#e3e8ee;--hair:#f2f5f8;
  --ac:#1f6feb;--acbg:#eaf1fd;--dot:#c6cfda;
  /* 分值配色：1/3/6/9/12 分各一色，非记分卡按分类借用同一组色板 */
  --c1:#54b47a;--c3:#4a9ed8;--c6:#e8a33d;--c9:#e8743d;--c12:#d9465f;
  --ok:#2f9e5f;--okbg:#eaf7ef;
  --warn:#9a6514;--warnbg:#fff6e8;--bad:#b02a3d;--badbg:#fff5f6;
  --sh:0 1px 2px rgba(27,36,48,.06),0 4px 14px rgba(27,36,48,.045);
  --hbg:rgba(242,244,247,.94);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171a;--card:#1c2024;--fg:#e6e9ed;--mut:#97a2ae;--bd:#2b3138;--hair:#262c33;
    --ac:#6aa6ff;--acbg:#16263c;--dot:#4a545f;
    --ok:#5fcf8d;--okbg:#14291d;
    --warn:#f0c070;--warnbg:#2b2210;--bad:#f29aa6;--badbg:#2a1517;
    --sh:none;--hbg:rgba(20,23,26,.94)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--hbg);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--bd);padding:env(safe-area-inset-top) 0 0}
.bar{max-width:720px;margin:0 auto;padding:0 16px}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px;
  display:flex;align-items:baseline;gap:8px;padding:12px 0 9px}
h1 small{font-weight:400;font-size:12px;color:var(--mut);letter-spacing:0}
.row{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 14px;border:1px solid var(--bd);
  border-radius:999px;background:var(--card);color:var(--fg)}
#q:focus{outline:2px solid var(--ac);outline-offset:-1px}
.tb{font:inherit;font-size:13.5px;font-weight:500;padding:8px 14px;border:1px solid var(--bd);
  border-radius:999px;background:var(--card);color:var(--mut);cursor:pointer;white-space:nowrap}
.tb[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
#chips{display:flex;gap:7px;overflow-x:auto;padding:9px 16px 11px;scrollbar-width:none;
  max-width:720px;margin:0 auto}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:13.5px;font-weight:500;padding:6px 13px;
  border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--mut);
  cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
#cnt{font-size:12px;color:var(--mut);padding:0 0 10px}
main{padding:14px 14px 0;max-width:720px;margin:0 auto}
.g[hidden],.c[hidden]{display:none}
.gh{margin:24px 2px 11px;font-size:15px;font-weight:700;color:var(--mut);letter-spacing:1.2px}
.g:first-child .gh{margin-top:2px}
.c{background:var(--card);border-radius:15px;padding:14px 16px;margin-bottom:11px;
  box-shadow:var(--sh);border-left:4px solid var(--bd)}
.c.done{opacity:.5}
.ch{display:flex;align-items:center;gap:10px;cursor:pointer}
.ch h3{margin:0;font-size:16.5px;font-weight:700;flex:1;min-width:0;line-height:1.45}
.pill{flex:0 0 auto;display:inline-block;color:#fff;font-size:12.5px;font-weight:700;
  border-radius:7px;padding:2px 9px;letter-spacing:.5px;background:var(--ac)}
.mk{flex:0 0 auto;width:28px;height:28px;border:1px solid var(--bd);border-radius:999px;
  background:transparent;color:var(--dot);font:inherit;font-size:14px;line-height:1;cursor:pointer}
.mk[aria-pressed=true]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
/* ▾ 在部分中文字体里会落到全角字形上（实测 21px 宽），固定盒宽免得把标题挤出卡片 */
.chev{flex:0 0 14px;width:14px;text-align:center;overflow:hidden;
  color:var(--dot);font-size:12px;line-height:1;transition:transform .2s}
.c.closed .chev{transform:rotate(-90deg)}
/* 左边框和标签同色：1/3/6/9/12 分一眼能分开，非记分卡按分类取色 */
.k1{border-left-color:var(--c1)}.k1 .pill{background:var(--c1)}
.k3{border-left-color:var(--c3)}.k3 .pill{background:var(--c3)}
.k6{border-left-color:var(--c6)}.k6 .pill{background:var(--c6)}
.k9{border-left-color:var(--c9)}.k9 .pill{background:var(--c9)}
.k12{border-left-color:var(--c12)}.k12 .pill{background:var(--c12)}
.ka{border-left-color:var(--ac)}.ka .pill{background:var(--ac)}
.cb{margin-top:10px}
.cb[hidden]{display:none}
.cb h4{margin:13px 0 6px;font-size:12.5px;color:var(--mut);font-weight:600;letter-spacing:.6px}
.cb h4:first-child{margin-top:0}
.cb p{margin:0 0 8px;font-size:15.5px}
.cb p:last-child{margin-bottom:0}
.cb ul{margin:0;padding-left:0;list-style:none}
.cb li{position:relative;padding:5px 0 5px 15px;font-size:15.5px;border-bottom:1px solid var(--hair)}
.cb li:last-child{border-bottom:0}
.cb li::before{content:"";position:absolute;left:1px;top:14px;width:5px;height:5px;
  border-radius:50%;background:var(--dot)}
dl{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 12px;margin:0;font-size:15.5px}
.kv dt{font-weight:700;color:var(--ac);padding:6px 0;border-bottom:1px solid var(--hair)}
.kv dd{margin:0;padding:6px 0;border-bottom:1px solid var(--hair)}
.kv dt:last-of-type,.kv dd:last-of-type{border-bottom:0}
.tw{overflow-x:auto;margin:0 0 2px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:7px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--hair)}
th{font-size:12.5px;color:var(--mut);font-weight:600;white-space:nowrap}
td:first-child{font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
/* 单元格里带换行的表（超速那张）：让它横向滚动，而不是把「10~20%：1 分」折成两行 */
.tw.nw table{width:auto;min-width:100%}
.tw.nw th,.tw.nw td{white-space:nowrap}
.no,.yes,.wn{border-radius:10px;padding:9px 11px;margin:9px 0 2px;font-size:14.5px;line-height:1.6}
.no{background:var(--badbg);color:var(--bad)}
.yes{background:var(--okbg);color:var(--ok)}
.wn{background:var(--warnbg);color:var(--warn)}
.em{font-weight:700;color:var(--ac)}
.no .em,.yes .em,.wn .em{color:inherit}
#top{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:42px;height:42px;
  border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);
  font:inherit;font-size:17px;box-shadow:0 4px 16px rgba(27,36,48,.18);cursor:pointer;display:none}
#top.on{display:block}
footer{max-width:720px;margin:0 auto;padding:16px 16px 30px;font-size:12.5px;color:var(--mut);line-height:1.7}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>科目一笔记速查卡 <small id="sub">点标题展开 · 共 0 张</small></h1>
    <div class="row">
      <input id="q" type="search" placeholder="搜关键词：超速 / 能见度 / 吊销 / ESP…" aria-label="搜索卡片">
      <button id="bU" class="tb" aria-pressed="false" title="只看还没标记「记住了」的卡片">未掌握</button>
    </div>
  </div>
  <div id="chips" role="group" aria-label="分类筛选"></div>
  <div class="bar"><div id="cnt"></div></div>
</header>
<main id="list"></main>
<footer>
  点卡片标题展开/收起，右侧 ✓ 标记「记住了」（存在本机浏览器里，不上传）。<br>
  内容整理自一份科目一笔记，<b>记分和罚款数字请以「交管12123」或官方题库为准</b>——
  笔记原文有几处自相矛盾，已单独放进「存疑」分类。
</footer>
<button id="top" title="回到顶部" aria-label="回到顶部">↑</button>
<script>
"use strict";
const D=[];
D.push(
{c:"技巧",t:"选项里这些词，基本是对的",s:[
  {p:"选择题拿不准时，优先选带下面这些词的选项。"},
  {kv:[["禁止类","不准、不得、不应、不能、严禁、禁止、应当"],
    ["让行类","减速让行、停车让行、礼让通行、减速避让、停车避让"],
    ["慢速类","缓慢通过、减速、平稳、逐渐、匀速下降"],
    ["观察类","提前观察、仔细观察、认真观察、瞭望"],
    ["安全类","间断轻踏、保证安全、确保安全、安全通过"],
    ["其他","双手紧握方向盘、利用发动机制动减速、承担民事责任"]]},
  {wn:"不符合这套规律的题，要单独拎出来背。"}]},
{c:"技巧",t:"选项里这些词，基本是错的",s:[
  {no:"**急、猛、迅速、紧急制动、急转**"},
  {li:["判断题见到这几个词，直接判错","打滑、爆胎题绝对不选「急」「猛」「迅速」"]}]},
{c:"技巧",t:"标志配色怎么对应选项",s:[
  {kv:[["黄底黑边三角","警告标志 → 选项多是「注意……」"],
    ["蓝底圆形","指示标志 → 必须/允许这样做"],
    ["红圈","禁令标志 → 不准这样做"]]}]},
{c:"技巧",t:"扣车还是吊证？看是车的问题还是人的问题",s:[
  {kv:[["车有问题 → 扣车","伪造、变造与车有关的证件、牌号；未放置保险标志"],
    ["人有问题 → 吊销驾驶证","伪造变造与驾驶有关的证件；严重违法（如饮酒）；驾驶拼改装或报废车；未携带证件"]]},
  {p:"罚款档位出现频率：**20~200 元**最高，**200~2000 元**次之。"}]},
);
D.push(
{c:"速度",t:"普通道路限速（没有限速标志时）",s:[
  {tbl:[["道路条件","城市道路","公路"],
    ["没有道路中心线","**30**","**40**"],
    ["有中心线，同方向 1 条车道","**50**","**70**"],
    ["有中心线，同方向 2 条以上","60","90"]]},
  {wn:"最后一行出处可疑，见「存疑」里那条——实际开车一律看限速标志。"}]},
{c:"速度",t:"高速公路车道与车速",s:[
  {p:"最高 **120**，最低 **60**，超车一律从左侧。"},
  {tbl:[["车道数","最右","中间","最左"],
    ["同方向 2 条","60~100","—","100~120"],
    ["同方向 3 条以上","60~90","90~110","110~120"]]},
  {wn:"道路限速标志与上面不一致时，以标志为准。"}]},
{c:"速度",t:"题目没说高速，限速基本选 30",s:[
  {p:"下面这些场景车速都不准超过 **30 km/h**："},
  {li:["驶入、驶出非机动车道","通过铁路道口","急弯路、窄桥、狭窄路面","下陡坡",
    "掉头、转弯","牵引故障车"]}]},
{c:"速度",t:"高速能见度三档（261 / 145 / 52离）",s:[
  {tbl:[["能见度","灯光","车速","车距"],
    ["<200 m","雾灯+近光+示廓灯+前后位灯","≤**60**","≥**100** m"],
    ["<100 m","上述 + 危险报警闪光灯","≤**40**","≥**50** m"],
    ["<50 m","上述 + 危险报警闪光灯","≤**20**","尽快从最近出口驶离"]]},
  {p:"口诀：**2-6-1、1-4-5、5-2-离**。"}]},
);
D.push(
{c:"距离",t:"禁停距离：站 3 口 5",s:[
  {kv:[["30 m 内禁停","公交站、急救站、加油站、消防栓或消防队（站）门前"],
    ["50 m 内禁停","交叉路口、铁路道口、急弯路、窄路、桥梁、陡坡、隧道"]]},
  {p:"口诀：**站 3 口 5**——有「站」的 30 米，路口类的 50 米。"}]},
{c:"距离",t:"其他要记的距离",s:[
  {kv:[["驶出高速","提前 **500 m** 做准备"],
    ["故障设警告标志（普通公路）","车后 **50~100 m**"],
    ["故障设警告标志（高速公路）","车后 **150 m** 外"],
    ["夜间会车","**150 m** 内改近光灯"]]}]},
{c:"灯光",t:"危险报警闪光灯用在哪",s:[
  {li:["临时停车","紧急停车","能见度低的恶劣天气（雨、雾）下行车","被牵引"]}]},
{c:"灯光",t:"远光还是近光",s:[
  {kv:[["窄路、窄桥、会车","近光灯"],
    ["夜间无路灯或照明不良","车速 <30 用近光，>30 用远光"],
    ["有路灯、照明良好","一律近光灯"]]},
  {wn:"「<30 近光、>30 远光」只在**没有路灯/照明不良**时成立，笔记原文漏了这个前提。"}]},
{c:"让行",t:"让行与先行原则",s:[
  {li:["转弯让直行","无信号交叉路口，让右方来车先行",
    "**相对方向**行驶时，右转弯让左转弯先行",
    "安全的让危险的先行、无障碍的一方先行","行人在人行横道上 → 停车礼让"]},
  {wn:"「右转让左转」的前提是两车**相对方向**同时转弯，不是通用原则，别套到同方向或交叉方向的题上。"}]},
{c:"时间",t:"连续驾驶与休息（420）",s:[
  {p:"连续驾驶 **4 小时**须休息 **20 分钟**以上。"},
  {kv:[["货车超时","记 3 分"],["危险品运输车超时","记 9 分"]]},
  {p:"口诀：**420**、**货3危9**。"}]},
);
D.push(
{c:"记分",t:"记 12 分",s:[
  {li:["饮酒后驾驶","致人轻伤以上或死亡的事故后逃逸，尚不构成犯罪",
    "伪造、变造，或使用其他车辆的号牌、行驶证、驾驶证",
    "代替他人接受处罚和记分，牟取经济利益",
    "高速/城市快速路超速 **50%** 以上；校车、客运、危险品车超速 **20%** 以上",
    "高速公路倒车、逆行、穿越中央分隔带掉头",
    "超载 **100%** 以上（所有车型）；校车、客车、危险品车超载 **20%** 以上"]},
  {p:"口诀：**高速普 5、危 2**（高速上普通车超 50%、危险品车超 20% 都是 12 分）。"}]},
{c:"记分",t:"记 9 分",s:[
  {li:["号牌相关（伪造、变造、使用其他号牌）",
    "中型以上客货车、校车、危险品车在高速公路违停",
    "驾驶证与准驾车型不符","未取得校车驾驶资格驾驶校车",
    "载客车、危险品车超载 20% 以上","7 座车超载 50% 以上",
    "校车/客车/危险品车超速 50% 以上"]}]},
{c:"记分",t:"记 6 分",s:[
  {li:["闯红灯、违反道路交通信号灯通行","占用应急车道",
    "驾驶证暂扣期间驾车","造成致人轻伤或财产损失的事故",
    "危险品运输车未按指定路线行驶、未悬挂警示标志","超重 50% 以上",
    "超载：校车/客车 <20%；7 座 20%~50%","超速：高速 <50%；校车/客车/危险品车 20%~50%"]}]},
{c:"记分",t:"记 3 分",s:[
  {li:["开车打电话","不避让校车、不避让行人","不按规定超车、让行、减速",
    "故障后不按规定设置警告标志、不按规定使用灯光","不按规定安装号牌",
    "普通路逆行","高速不按规定车道行驶、低于最低时速","强行占道穿插",
    "连续驾驶超时（420）","超重 30%~50%；普通货车超载 30%~50%；超速 20%~50%"]}]},
{c:"记分",t:"记 1 分",s:[
  {li:["不按规定使用灯光","不系安全带","不按规定会车、倒车、掉头",
    "违反禁令标志","不按规定参加年检","驾驶擅自改装的车",
    "超长、超宽、超高","普通车/危险品车超速 10%~20%"]}]},
{c:"记分",t:"记分周期与驾驶证有效期",s:[
  {kv:[["记分周期","12 个月"],["满 12 分","重新学习并考科目一"],
    ["驾驶证有效期","6 年、10 年、长期，到期审验"]]}]},
);
D.push(
{c:"超限",t:"超重（货物）",s:[
  {tbl:[["超重比例","记分"],["<30%","1 分"],["30%~50%","3 分"],[">50%","6 分"]]}]},
{c:"超限",t:"超载（人数）",s:[
  {tbl:[["车型","比例","记分"],
    ["校车、客车","<20%","6 分"],["校车、客车","≥20%","**12 分**"],
    ["7 座车","<50%","6 分"],["7 座车","50%~100%","9 分"],["7 座车",">100%","**12 分**"],
    ["普通货车","≤50%","3 分"],["普通货车",">50%","6 分"]]},
  {wn:"这张表按「同分值合并」整理过。笔记原文里 7 座和普通货车有两行同分的重复分档，疑似抄漏了一档。"},
  {p:"口诀：**校客 20 → 6**（校车客车超 20% 以内 6 分，超了就 12 分）。"}]},
{c:"超限",t:"超速",s:[
  {tbl:[["车型","普通路","高速 / 城市快速路"],
    ["普通车","10~20%：1 分\n20~50%：3 分\n>50%：6 分","<50%：6 分\n>50%：**12 分**"],
    ["校车/客车/危险品车","10~20%：1 分\n20~50%：6 分\n>50%：9 分","<20%：6 分\n>20%：**12 分**"]]},
  {wn:"笔记里「普通车普通路 20~50%」一处写 3 分、一处写 6 分，自相矛盾，考前务必核对。"}]},
{c:"准驾",t:"准驾车型代号",s:[

// ===== 渲染 =====
const $=s=>document.querySelector(s);
const el=(t,a,...k)=>{const n=document.createElement(t);
  for(const p in a||{})p==="html"?n.innerHTML=a[p]:n.setAttribute(p,a[p]);
  // flat(Infinity)：sect() 返回的是数组，卡片体又是数组的数组，少拍平一层就会把数组
  // 直接 append 成「[object HTMLDivElement]」这样的文本
  k.flat(Infinity).forEach(x=>x!=null&&x!==false&&n.append(x));return n};
const KEY="kemu1.done";
const done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));
const save=()=>localStorage.setItem(KEY,JSON.stringify([...done]));
// 行内只允许两种标记：**加重** 和 换行，避免把整段笔记当 HTML 塞进页面
const rich=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
  .replace(/\*\*(.+?)\*\*/g,'<b class="em">$1</b>').replace(/\n/g,"<br>");
function sect(s){
  const out=[];
  if(s.h)out.push(el("h4",{},s.h));
  if(s.p)out.push(el("p",{html:rich(s.p)}));
  if(s.yes)out.push(el("div",{class:"yes",html:rich(s.yes)}));
  if(s.no)out.push(el("div",{class:"no",html:rich(s.no)}));
  if(s.wn)out.push(el("div",{class:"wn",html:rich(s.wn)}));
  if(s.li)out.push(el("ul",{},s.li.map(x=>el("li",{html:rich(x)}))));
  if(s.kv)out.push(el("dl",{class:"kv"},s.kv.map(([k,v])=>[el("dt",{},k),el("dd",{html:rich(v)})])));
  if(s.tbl){const[hd,...rs]=s.tbl;
    const nw=s.tbl.some(r=>r.some(x=>/\n/.test(x)))?" nw":"";
    out.push(el("div",{class:"tw"+nw},el("table",{},
      el("thead",{},el("tr",{},hd.map(x=>el("th",{html:rich(x)})))),
      el("tbody",{},rs.map(r=>el("tr",{},r.map(x=>el("td",{html:rich(x)}))))))));}
  return out;
}
// 非记分卡按分类借用同一组分值色板，让整页只有五种主色，不花
const COL={技巧:"a",速度:"c3",距离:"c1",灯光:"c6",让行:"c1",时间:"c1",
  超限:"c9",准驾:"c3",罚款:"c9",处罚:"c12",缩写:"c3",存疑:"c12"};
const SC={1:"c1",3:"c3",6:"c6",9:"c9",12:"c12"};
function badge(d){
  // 「记 N 分」这类卡片直接用分值当标签，和原卡片页 1分/3分 的配色对齐
  const m=/^记\s*(\d+)\s*分$/.exec(d.t);
  return m?{txt:m[1]+" 分",k:SC[+m[1]]||"a"}:{txt:d.c,k:COL[d.c]||"a"};
}
const CARDS=D.map((d,i)=>{
  const id="k"+i,bg=badge(d);
  const body=el("div",{class:"cb",id:id+"b",hidden:"hidden"},d.s.map(sect));
  const mk=el("button",{class:"mk","aria-pressed":done.has(id)?"true":"false",
    "aria-label":"标记记住了",title:"记住了"},"✓");
  const hd=el("div",{class:"ch",role:"button",tabindex:"0","aria-expanded":"false","aria-controls":id+"b"},
    el("span",{class:"pill"},bg.txt),el("h3",{},d.t),mk,el("span",{class:"chev","aria-hidden":"true"},"▾"));
  const card=el("div",{class:"c closed k"+bg.k.replace("c","")+(done.has(id)?" done":"")},hd,body);
  const set=o=>{body.hidden=!o;card.classList.toggle("closed",!o);
    hd.setAttribute("aria-expanded",o?"true":"false")};
  hd.onclick=e=>{if(e.target!==mk)set(body.hidden)};
  hd.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();set(body.hidden)}};
  mk.onclick=()=>{const on=!done.has(id);on?done.add(id):done.delete(id);save();
    mk.setAttribute("aria-pressed",on?"true":"false");card.classList.toggle("done",on);refresh()};
  return{d,id,card,set,txt:(d.c+" "+d.t+" "+JSON.stringify(d.s)).toLowerCase()};
});
// ===== 按分类分组，每组一个小标题（一 · 技巧） =====
const cn=n=>n<=10?"一二三四五六七八九十"[n-1]:"十"+"一二三四五六七八九"[n-11];
const GRP=[];
{
  const by=new Map();
  CARDS.forEach(c=>{(by.get(c.d.c)||by.set(c.d.c,[]).get(c.d.c)).push(c)});
  let i=0;
  by.forEach((cs,c)=>{i++;
    const g=el("section",{class:"g"},el("h2",{class:"gh"},`${cn(i)} · ${c}`),cs.map(x=>x.card));
    g._cs=cs;GRP.push(g)});
}
// ===== 筛选 =====
let cat="全部",onlyU=false;
const CATS=["全部",...[...new Set(D.map(d=>d.c))]];
$("#chips").replaceChildren(...CATS.map(c=>{
  const n=D.filter(d=>c==="全部"||d.c===c).length;
  const b=el("button",{class:"chip","aria-pressed":c===cat?"true":"false"},`${c} ${n}`);
  b.onclick=()=>{cat=c;[...$("#chips").children].forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");refresh()};
  return b;}));
$("#list").replaceChildren(...GRP);
$("#sub").textContent=`点标题展开 · 共 ${CARDS.length} 张`;
function refresh(){
  const kw=$("#q").value.trim().toLowerCase();
  let n=0;
  CARDS.forEach(c=>{
    const hit=(cat==="全部"||c.d.c===cat)&&(!onlyU||!done.has(c.id))&&(!kw||c.txt.includes(kw));
    c.card.hidden=!hit;
    if(hit){n++;if(kw)c.set(true)}        // 搜索命中的卡片直接展开，手机上少点一次
  });
  // 整组都筛掉了就连小标题一起藏，不留空标题
  GRP.forEach(g=>{g.hidden=!g._cs.some(c=>!c.card.hidden)});
  const left=CARDS.filter(c=>!done.has(c.id)).length;
  $("#cnt").textContent=(kw?`搜到 ${n} 张`:`显示 ${n} 张`)+` · 还没记住 ${left} 张`;
}
$("#q").oninput=refresh;
$("#bU").onclick=()=>{onlyU=!onlyU;$("#bU").setAttribute("aria-pressed",onlyU?"true":"false");refresh()};
addEventListener("scroll",()=>$("#top").classList.toggle("on",scrollY>400));
$("#top").onclick=()=>scrollTo({top:0,behavior:"smooth"});
refresh();
</script>
