<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>质检结果浏览与标注</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--bd:#dde1e6;--tx:#1f2933;--mut:#6b7785;--red:#c0392b;--redbg:#fdecea;--grn:#1e8449;--grnbg:#e6f5ec;--amb:#a96a00;--ambbg:#fff4d9;--blu:#2457c5;--blubg:#e8effc}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--bg);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:3px 10px;cursor:pointer}
button:hover{background:#eef1f5}
button.on{background:var(--blu);color:#fff;border-color:var(--blu)}
button.pri{background:var(--blu);color:#fff;border-color:var(--blu)}
input,select,textarea{border:1px solid var(--bd);border-radius:6px;padding:3px 8px;background:#fff}
textarea{width:100%;resize:vertical}
header{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#fff;border-bottom:1px solid var(--bd);flex-wrap:wrap}
header .sp{flex:1}
#stat{color:var(--mut);font-size:13px}
#app{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 370px}
#app>div{overflow:auto;min-height:0}
#list{background:#fff;border-right:1px solid var(--bd)}
#list .flt{position:sticky;top:0;background:#fff;padding:8px;border-bottom:1px solid var(--bd);display:grid;gap:5px;z-index:2}
.it{padding:6px 10px;border-bottom:1px solid #eef0f3;cursor:pointer;font-size:13px}
.it:hover{background:#f6f8fb}
.it.act{background:var(--blubg);box-shadow:inset 3px 0 var(--blu)}
.it .r1{display:flex;gap:6px;align-items:center}
.it .r2{color:var(--mut);font-size:12px}
#main{padding:12px 16px}
#side{background:#fff;border-left:1px solid var(--bd);padding:12px 14px}
#side h3{margin:0 0 6px;font-size:14px}
.chip{display:inline-block;padding:0 7px;border-radius:10px;font-size:12px;line-height:19px;border:1px solid var(--bd);background:#fff;white-space:nowrap}
.c-fail{background:var(--redbg);color:var(--red);border-color:#f3c0ba}
.c-pass{background:var(--grnbg);color:var(--grn);border-color:#b8e0c8}
.c-na{background:#f1f2f4;color:#8a949e}
.c-unsure{background:var(--ambbg);color:var(--amb);border-color:#f0d89a}
.c-tgt{outline:2px solid var(--red);outline-offset:1px;font-weight:600}
.c-key{outline:2px solid var(--blu);outline-offset:1px;font-weight:600}
.code{font-weight:600;color:var(--blu)}
.mut{color:var(--mut)}
.msg,.step{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin:0 0 10px}
.msg>.hd,.step>.hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;cursor:pointer}
.step.tgt{border:2px solid var(--red)}
.step.after{opacity:.82}
.step.hasfail>.hd{background:#fff8f7}
.bd{padding:2px 12px 10px;border-top:1px solid #eef0f3}
.pv{color:var(--mut);font-size:12.5px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre{margin:4px 0;padding:8px;background:#f7f8fa;border:1px solid #eceef1;border-radius:6px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:520px;overflow:auto}
pre.th{background:#fbf9f1}
.lb{font-size:12px;color:var(--mut);margin-top:8px}
.call{border-left:3px solid var(--blu);padding-left:8px;margin:6px 0}
.res{border-left:3px solid #9aa5b1;padding-left:8px;margin:4px 0 8px}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.seg{margin:4px 0;padding:6px 8px;background:#f7f8fa;border-radius:6px;font-size:13px;white-space:pre-wrap}
.seg b{color:var(--blu)}
.hum{margin-top:8px;padding:6px 8px;background:var(--ambbg);border-radius:6px}
.hum input[type=text]{width:100%;margin-top:4px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.btns button{flex:1;padding:6px 4px}
.btns button.sel-fail{background:var(--red);color:#fff;border-color:var(--red)}
.btns button.sel-pass{background:var(--grn);color:#fff;border-color:var(--grn)}
.btns button.sel-unsure{background:#d9a21b;color:#fff;border-color:#d9a21b}
#drop{margin:60px auto;max-width:520px;padding:40px;text-align:center;border:2px dashed #aab4c0;border-radius:12px;color:var(--mut);background:#fff}
dl{margin:6px 0;display:grid;grid-template-columns:78px 1fr;gap:2px 8px;font-size:12.5px}
dt{color:var(--mut)}dd{margin:0;word-break:break-all}
kbd{border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px;background:#fff}
.ov{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--blu);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.ov h4{margin:0 0 6px;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ov .kv{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:2px 0 6px}
.ov .kv b{color:var(--tx)}
.sstrip{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
.sc{min-width:26px;text-align:center;padding:1px 5px;border:1px solid var(--bd);border-radius:5px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;cursor:pointer;background:#fff;color:var(--mut)}
.sc:hover{box-shadow:0 0 0 2px var(--blubg)}
.sc.f{background:var(--redbg);color:var(--red);border-color:#e8a9a0;font-weight:600}
.sc.u{background:#f1f2f4;color:#8a949e;border-style:dashed}
.sc.p{background:var(--grnbg);color:var(--grn);border-color:#9fd4b4;font-weight:600}
.sc.t{outline:2px solid var(--red);outline-offset:1px}
.flist{margin:4px 0 0;display:grid;gap:3px;max-height:176px;overflow:auto}
.frow{display:flex;gap:6px;align-items:center;padding:3px 6px;border:1px solid #f0d4cf;background:#fdf6f5;border-radius:6px;cursor:pointer;font-size:12.5px}
.frow:hover{background:var(--redbg)}
.frow .n{font-weight:600;color:var(--red);min-width:62px;white-space:nowrap}
.step.hasfail{border-color:#e8a9a0}
.concl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 8px;border-radius:6px;margin:6px 0 2px;background:#f7f8fa}
.concl.bad{background:var(--redbg)}
.concl.good{background:var(--grnbg)}
</style></head>
<body>
<header>
  <b>质检结果浏览与标注</b>
  <button id="bOpen" class="pri">打开 jsonl</button>
  <input id="fOpen" type="file" accept=".jsonl,.json,.ndjson" hidden>
  <span id="fname" class="mut"></span>
  <span id="stat"></span>
  <span class="sp"></span>
  <button id="bExpAll" title="导出带 human_label / human_note 的完整 jsonl（未标注的行原样保留）">导出完整 jsonl</button>
  <button id="bExpJson">导出标注 JSON</button>
  <button id="bExpCsv">导出 CSV</button>
  <button id="bImp">导入标注</button>
  <input id="fImp" type="file" accept=".json" hidden>
</header>
<div id="app">
  <div id="list"></div>
  <div id="main"><div id="drop">把 qc_fail_samples.n10.jsonl 拖到这里，或点击上方“打开 jsonl”<br><span class="mut">文件只在本机浏览器内读取，不上传；标注自动保存在浏览器本地，并可随时导出。</span></div></div>
  <div id="side"></div>
</div>
<script>
"use strict";
const S={file:null,offs:[],sum:[],cur:-1,cache:new Map(),ann:{},names:{},splits:{},order:[],view:[],flt:{code:"",st:"",split:"",q:""}};
const LS="qcrev.v1";
const $=s=>document.querySelector(s);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in props||{}){const v=props[k];
    if(k==="class")e.className=v;
    else if(k==="text")e.textContent=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));
  return e;
}
const status=t=>{$("#stat").textContent=t};
const LBL={fail:"确认Fail（机器判对）",pass:"机器误判（实际Pass）",unsure:"存疑待复核"};
const LBLS={fail:"确认Fail",pass:"误判",unsure:"存疑"};

async function getRow(k,nocache){
  if(!nocache&&S.cache.has(k)){const v=S.cache.get(k);S.cache.delete(k);S.cache.set(k,v);return v}
  const [a,b]=S.offs[k];
  const r=JSON.parse(await S.file.slice(a,b).text());
  if(!nocache){S.cache.set(k,r);if(S.cache.size>4)S.cache.delete(S.cache.keys().next().value)}
  return r;
}
function summarize(r,k){
  const q=(r.trajectory_metadata||{}).qc_sample||{};
  const id=q.data_id||r.data_id||r.task_id;
  if(q.check_key)S.names[q.check_key]={code:q.check_code,item:q.check_item};
  // 累积「判定分段 -> 该分段负责哪几个检查项」。judge_split 只在逐行的 qc_sample 里，整份文件扫完才拿到完整映射
  if(q.check_key&&q.judge_split){const a=S.splits[q.judge_split]=S.splits[q.judge_split]||[];if(!a.includes(q.check_key))a.push(q.check_key)}
  let nf=0,nu=0,nk=0;const agg={};
  const cand=r.candidates&&r.candidates[0]&&r.candidates[0][0];
  const sms=(r.prompt||[]).filter(m=>m.role==="assistant").concat(cand?[cand]:[]);
  for(const m of sms){
    const cl=((m.step_metadata||{}).judge_result||{}).checklist;
    if(!cl||!Object.keys(cl).length){nu++;continue}
    const bad=Object.keys(cl).filter(x=>cl[x]==="Fail");
    if(bad.length){nf++;bad.forEach(x=>agg[x]=(agg[x]||0)+1);if(q.check_key&&cl[q.check_key]==="Fail")nk++}
  }
  return {k,id,task:r.task_id,sid:q.sample_id,key:q.check_key,code:q.check_code,item:q.check_item,
    step:q.step,n:q.n_steps,loc:q.step_loc,split:q.judge_split,fails:q.step_fail_items||[],
    seg:q.judge_reason_seg,segzh:q.judge_reason_zh,nf,nu,nk,agg,
    src:q.source,ds:q.dataset,hl:q.human_label,hn:q.human_note||"",hs:q.human_step_marks||null};
}
async function loadFile(file){
  S.file=file;S.offs=[];S.sum=[];S.cache.clear();S.cur=-1;
  $("#fname").textContent=file.name;
  const size=file.size,CH=16<<20;let start=0;
  for(let pos=0;pos<size;pos+=CH){
    status(`建立索引 ${Math.round(pos/size*100)}%`);
    const buf=new Uint8Array(await file.slice(pos,Math.min(size,pos+CH)).arrayBuffer());
    let i,from=0;
    while((i=buf.indexOf(10,from))>=0){if(pos+i>start)S.offs.push([start,pos+i]);start=pos+i+1;from=i+1}
  }
  if(start<size)S.offs.push([start,size]);
  for(let k=0;k<S.offs.length;k++){
    status(`解析摘要 ${k+1}/${S.offs.length}`);
    S.sum.push(summarize(await getRow(k,true),k));
    if(k%8===0)await new Promise(r=>setTimeout(r));
  }
  try{S.ann=JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){S.ann={}}
  for(const s of S.sum){
    if(!S.ann[s.id]&&(s.hl||s.hn||s.hs))S.ann[s.id]={label:s.hl||null,note:s.hn,steps:s.hs||{},ts:null};
  }
  initFilters();applyFilter();
  const last=+localStorage.getItem(LS+".cur."+file.name);
  select(S.view.length?(S.view.find(s=>s.k===last)||S.view[0]).k:-1);
}

let saveT=0;
function ann(id){return S.ann[id]||(S.ann[id]={label:null,note:"",steps:{},ts:null})}
function marked(a){
  if(!a)return false;
  return !!(a.label||(a.note&&a.note.trim())||Object.values(a.steps||{}).some(x=>x.mark||(x.note&&x.note.trim())));
}
function touch(a){a.ts=new Date().toISOString();clearTimeout(saveT);saveT=setTimeout(persist,300);refreshStat()}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S.ann))}catch(e){status("本地存储失败："+e.message+"，请先导出")}}
function refreshStat(){
  const n=S.sum.length,m=S.sum.filter(s=>marked(S.ann[s.id])).length;
  const c=l=>S.sum.filter(s=>(S.ann[s.id]||{}).label===l).length;
  status(`已标注 ${m}/${n} · 确认Fail ${c("fail")} · 误判 ${c("pass")} · 存疑 ${c("unsure")}`);
  S.sum.forEach(s=>{const el=document.getElementById("it"+s.k);if(el)paintItem(el,s)});
}
function download(blob,name){
  const a=h("a",{href:URL.createObjectURL(blob),download:name});
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
const base=()=>(S.file?S.file.name:"qc").replace(/\.jsonl?$/,"");
function annRows(){
  return S.sum.filter(s=>marked(S.ann[s.id])).map(s=>{const a=S.ann[s.id];
    return {data_id:s.id,task_id:s.task,sample_id:s.sid,check_code:s.code,check_item:s.item,step:s.step,n_steps:s.n,
      human_label:a.label||null,human_note:a.note||"",human_step_marks:a.steps||{},updated_at:a.ts}});
}
function expJson(){download(new Blob([JSON.stringify(annRows(),null,1)],{type:"application/json"}),base()+".annotations.json")}
function expCsv(){
  const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const cols=["data_id","task_id","sample_id","check_code","check_item","step","n_steps","human_label","human_note","step_marks","updated_at"];
  const L=[cols.join(",")].concat(annRows().map(r=>cols.map(c=>esc(c==="step_marks"?
    Object.entries(r.human_step_marks).filter(([,x])=>x.mark||x.note).map(([n,x])=>`step${n}:${x.mark||""} ${x.note||""}`).join(" ; "):r[c])).join(",")));
  download(new Blob(["﻿"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}),base()+".annotations.csv");
}
async function expAll(){
  if(!S.file)return;
  const parts=[];
  for(let k=0;k<S.offs.length;k++){
    status(`生成 ${k+1}/${S.offs.length}`);
    const s=S.sum[k],a=S.ann[s.id];
    if(!marked(a)){parts.push(S.file.slice(S.offs[k][0],S.offs[k][1]),"\n");continue}
    const r=await getRow(k,true),q=r.trajectory_metadata.qc_sample;
    q.human_label=a.label||null;q.human_note=a.note||"";
    const st=Object.fromEntries(Object.entries(a.steps||{}).filter(([,x])=>x.mark||(x.note&&x.note.trim())));
    if(Object.keys(st).length)q.human_step_marks=st;else delete q.human_step_marks;
    q.human_updated_at=a.ts;
    parts.push(JSON.stringify(r),"\n");
    if(k%8===0)await new Promise(r=>setTimeout(r));
  }
  download(new Blob(parts,{type:"application/x-ndjson"}),base()+".reviewed.jsonl");
  refreshStat();
}
async function impAnn(file){
  const arr=JSON.parse(await file.text());let n=0;
  for(const r of arr){
    if(!r.data_id)continue;
    S.ann[r.data_id]={label:r.human_label||null,note:r.human_note||"",steps:r.human_step_marks||{},ts:r.updated_at||null};n++;
  }
  persist();applyFilter();refreshStat();if(S.cur>=0)select(S.cur);
  status(`已导入 ${n} 条标注`);setTimeout(refreshStat,2500);
}

function initFilters(){
  const codes=[...new Map(S.sum.map(s=>[s.code,s.item])).entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),"en",{numeric:true}));
  const splits=[...new Set(S.sum.map(s=>s.split))].sort();
  const L=$("#list");L.replaceChildren();
  const sel=(id,opts,ph)=>h("select",{id,onchange:onFlt},h("option",{value:""},ph),opts.map(([v,t])=>h("option",{value:v},t)));
  L.append(h("div",{class:"flt"},
    sel("fCode",codes.map(([c,i])=>[c,`${c} ${i}`]),"全部检查项"),
    sel("fSt",[["todo","未标注"],["done","已标注"],["fail","确认Fail"],["pass","机器误判"],["unsure","存疑"]],"全部状态"),
    sel("fSplit",splits.map(x=>[x,x]),"全部判定分段"),
    h("input",{id:"fQ",type:"search",placeholder:"搜索 task_id / data_id / 理由…",oninput:onFlt}),
    h("div",{id:"fCnt",class:"mut"})),
    h("div",{id:"items"}));
}
function onFlt(){
  const old=S.flt.code;
  S.flt={code:$("#fCode").value,st:$("#fSt").value,split:$("#fSplit").value,q:$("#fQ").value.trim().toLowerCase()};
  applyFilter();
  if(!S.sum.length)return;
  // 当前样本被筛掉就跳到首条，否则仅在检查项筛选变化时重渲染右侧（聚焦模式变了）
  if(!S.view.some(s=>s.k===S.cur))select(S.view.length?S.view[0].k:-1);
  else if(S.cur>=0&&old!==S.flt.code)select(S.cur);
}
function applyFilter(){
  const f=S.flt;
  S.view=S.sum.filter(s=>{
    const a=S.ann[s.id];
    if(f.code&&s.code!==f.code)return false;
    if(f.split&&s.split!==f.split)return false;
    if(f.st==="todo"&&marked(a))return false;
    if(f.st==="done"&&!marked(a))return false;
    if(["fail","pass","unsure"].includes(f.st)&&(!a||a.label!==f.st))return false;
    if(f.q&&!(`${s.id} ${s.task} ${s.sid} ${s.item} ${s.code}`.toLowerCase().includes(f.q)))return false;
    return true;
  });
  const box=$("#items");box.replaceChildren();
  for(const s of S.view){
    const el=h("div",{class:"it",id:"it"+s.k,onclick:()=>select(s.k)});
    paintItem(el,s);box.append(el);
  }
  $("#fCnt").textContent=`显示 ${S.view.length}/${S.sum.length}`;
  refreshStat();
}
function paintItem(el,s){
  const a=S.ann[s.id];
  el.className="it"+(s.k===S.cur?" act":"");
  el.replaceChildren(
    h("div",{class:"r1"},h("span",{class:"mut"},"#"+(s.k+1)),h("span",{class:"code"},s.code),h("span",{},s.item),h("span",{class:"sp",style:"flex:1"}),
      a&&a.label?h("span",{class:"chip c-"+(a.label==="pass"?"pass":a.label==="fail"?"fail":"unsure")},LBLS[a.label]||a.label):(marked(a)?h("span",{class:"chip"},"有备注"):null)),
    h("div",{class:"r2"},
      `step ${s.step}/${s.n} · ${s.split} · `,
      h("span",{style:s.nf?"color:var(--red);font-weight:600":""},`Fail步 ${s.nf||0}`),
      s.nk>1?h("span",{style:"color:var(--red)"},`（本项 ${s.nk}）`):null,
      ` · ${(s.task||"").slice(0,18)}`));
}
async function select(k){
  const prev=document.getElementById("it"+S.cur);
  S.cur=k;
  if(prev)paintItem(prev,S.sum[+prev.id.slice(2)]);
  if(k<0){$("#main").replaceChildren(h("div",{id:"drop"},"没有符合筛选条件的样本"));$("#side").replaceChildren();return}
  const el=document.getElementById("it"+k);
  if(el){paintItem(el,S.sum[k]);el.scrollIntoView({block:"nearest"})}
  localStorage.setItem(LS+".cur."+S.file.name,k);
  const row=await getRow(k);
  if(S.cur!==k)return;
  renderMain(row,S.sum[k]);renderSide(row,S.sum[k]);
}
function move(d){
  const i=S.view.findIndex(s=>s.k===S.cur),j=Math.max(0,Math.min(S.view.length-1,i+d));
  if(S.view[j])select(S.view[j].k);
}
function nextTodo(){
  const i=S.view.findIndex(s=>s.k===S.cur);
  const n=S.view.slice(i+1).concat(S.view.slice(0,i)).find(s=>!marked(S.ann[s.id]));
  if(n)select(n.k);else status("当前筛选下已全部标注");
}

const textOf=c=>typeof c==="string"?c:Array.isArray(c)?c.map(b=>b&&b.text!=null?b.text:b&&b.type?`[${b.type}]`:JSON.stringify(b)).join("\n"):c==null?"":JSON.stringify(c);
const nm=k=>S.names[k]?`${S.names[k].code} ${S.names[k].item}`:k;
// 只有左侧筛选了具体检查项时才聚焦该项；选「全部检查项」时返回 null，右侧一律平等展示不加蓝圈
const fkey=sum=>S.flt.code?sum.key:null;
function longPre(text,cls,lim=3000){
  const p=h("pre",{class:cls||""});
  if(text.length<=lim){p.textContent=text;return p}
  const w=h("div");p.textContent=text.slice(0,lim)+" …";
