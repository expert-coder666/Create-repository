<style>
:root{color-scheme:light dark;--bg:#f5f7fb;--panel:#fff;--text:#182230;--muted:#627084;--line:#dce2ec;--brand:#2367d1;--brand-bg:#e8f0ff;--ok:#087443;--ok-bg:#dcf7e9;--bad:#b52318;--bad-bg:#fee4e2;--unknown:#5c6675;--unknown-bg:#edf0f4;--warn:#9a6700;--warn-bg:#fff3cd;--code:#f2f4f8}
@media(prefers-color-scheme:dark){:root{--bg:#11151c;--panel:#191f29;--text:#e7edf7;--muted:#a8b3c5;--line:#303a49;--brand:#81b1ff;--brand-bg:#18345e;--ok:#6ee7ad;--ok-bg:#123d2b;--bad:#ff9990;--bad-bg:#552220;--unknown:#c2cad6;--unknown-bg:#2c3441;--warn:#ffd477;--warn-bg:#503a0b;--code:#121720}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;min-height:62px;padding:10px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px)}h1{margin:0;font-size:18px;white-space:nowrap}.grow{flex:1}.muted,.hint{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);padding:7px 11px}.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.stat{font-size:12px;color:var(--muted)}
#layout{display:grid;grid-template-columns:330px minmax(0,1fr);height:calc(100vh - 62px);overflow:hidden}aside{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px}.filters{display:grid;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}input,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--panel);color:var(--text)}.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.record{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:11px 4px}.record:hover,.record.active{background:var(--brand-bg)}.record-id{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record-meta{font-size:12px;color:var(--muted);margin-top:3px}.badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:650}.ok{color:var(--ok);background:var(--ok-bg)}.bad{color:var(--bad);background:var(--bad-bg)}.unknown{color:var(--unknown);background:var(--unknown-bg)}.conflict{color:var(--warn);background:var(--warn-bg)}.message{border-left:4px solid var(--line);border-top:1px solid var(--line);background:var(--panel)}.message.system{border-left-color:#728197}.message.user{border-left-color:#3195d1}.message.assistant{border-left-color:#7a55d8}.message.tool{border-left-color:#159367}.tabs{display:flex;gap:4px;margin:10px 0 14px;padding:4px;border-radius:10px;background:var(--code);overflow-x:auto}.tab{border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:700;padding:9px 15px;white-space:nowrap}.tab:hover,.tab.active{background:var(--panel);color:var(--brand);box-shadow:0 1px 5px color-mix(in srgb,var(--text) 12%,transparent)}.message-head{display:flex;gap:8px;align-items:center;padding:10px 14px;background:color-mix(in srgb,var(--code) 70%,transparent);cursor:pointer}.message summary{list-style:none}.message summary::-webkit-details-marker{display:none}.role{border-radius:5px;padding:2px 8px;color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em}.role.system{background:#718096}.role.user{background:#3195d1}.role.assistant{background:#7a55d8}.role.tool{background:#159367}.step{color:var(--muted);font-weight:650}.msg-label{margin-left:auto}.message-body{padding:14px}.block{white-space:pre-wrap;overflow-wrap:anywhere}.message details{margin-top:10px;border:1px solid var(--line);border-radius:7px}.message details summary{padding:8px 10px;font-weight:650}.message details[open] summary{border-bottom:1px solid var(--line)}.conversation-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}.conversation-controls label{font-size:12px;color:var(--muted)}.conversation-controls select{width:auto;padding:5px 8px}.conversation-controls .btn{padding:5px 9px}
main{min-width:0;padding:20px;overflow:auto}.empty{max-width:720px;margin:8vh auto;padding:42px 25px;border:2px dashed var(--line);border-radius:12px;text-align:center;background:var(--panel)}.drop.over{border-color:var(--brand);background:var(--brand-bg)}.record-header{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}.record-header h2{font-size:19px;margin:0;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}.nav{margin-left:auto;display:flex;align-items:center;gap:7px;white-space:nowrap}.section{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:12px 0;overflow:hidden}.section-title{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px}.body{padding:14px}.task-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.25fr);gap:16px}.question{white-space:pre-wrap;font-size:15px}.image-wrap{min-height:180px;border:1px solid var(--line);border-radius:8px;background:var(--code);display:flex;align-items:center;justify-content:center;overflow:hidden}.image-wrap img{display:block;max-width:100%;max-height:640px;object-fit:contain}.image-fallback{padding:16px;overflow-wrap:anywhere}.image-link{display:inline-block;margin-top:8px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{border:1px solid var(--line);border-radius:8px;padding:11px;min-height:70px}.answer h4{margin:0 0 7px;font-size:13px}.answer-text,.pre{white-space:pre-wrap;overflow-wrap:anywhere}.answer-text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.details{border-top:1px solid var(--line)}details summary{cursor:pointer;padding:12px 14px;font-weight:650}details[open] summary{border-bottom:1px solid var(--line)}pre{margin:0;padding:14px;max-height:620px;overflow:auto;background:var(--code);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.tool{padding:12px 14px;border-top:1px solid var(--line)}.tool:first-child{border-top:0}.tool-name{font-weight:700}.label-list{display:flex;flex-wrap:wrap;gap:5px}.label-value{font:12px ui-monospace,monospace;padding:2px 7px;border:1px solid var(--line);border-radius:5px}.label-value.one{border-color:var(--brand);color:var(--brand);background:var(--brand-bg)}.kv{display:grid;grid-template-columns:minmax(150px,28%) 1fr;gap:0;border-top:1px solid var(--line)}.kv dt,.kv dd{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.kv dt{font-weight:650;background:color-mix(in srgb,var(--code) 70%,transparent)}
@media(max-width:800px){header{flex-wrap:wrap}h1{width:100%}#layout{display:block;height:auto;overflow:visible}aside{border-right:0;border-bottom:1px solid var(--line);max-height:38vh}main{padding:12px;height:auto;overflow:visible}.task-grid,.answers{grid-template-columns:1fr}.nav{margin-left:0;width:100%}}
</style>
</head>
<body>
<header><h1>🖼️ 视觉推理 JSONL 查看器</h1><button class="btn primary" id="pick">选择 JSONL 文件</button><input id="file" type="file" accept=".jsonl,.json,.txt,application/json,text/plain" hidden><span id="fileInfo" class="stat">数据仅在本浏览器内解析，不会上传。</span><span class="grow"></span><span id="loadInfo" class="stat"></span></header>
<div id="layout"><aside id="sidebar" class="hidden"><div class="filters"><input id="search" type="search" placeholder="搜索 ID、题型、题目、答案…"><div class="filter-row"><select id="category"><option value="">全部题型</option></select><select id="status"><option value="">全部评测状态</option><option value="true">正确</option><option value="false">错误</option><option value="unknown">未评测</option></select></div><button id="clear" class="btn">清除筛选</button><span id="filterInfo" class="stat"></span></div><div id="recordList"></div></aside><main id="main"><div id="drop" class="empty drop"><h2>加载视觉推理数据</h2><p>拖入 <b>.jsonl</b> 文件，或点击上方“选择 JSONL 文件”。</p><p class="hint">支持本数据集的 data_id、category、题目图片、参考答案、模型作答、推理过程、工具和元数据字段。</p></div></main></div>
<script>
'use strict';
const $=s=>document.querySelector(s),state={records:[],filtered:[],selected:-1,errors:[],file:null,tab:'overview'};
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v),text=v=>v==null?'—':typeof v==='string'?v:JSON.stringify(v),pick=(o,path,fallback)=>{try{const v=path.reduce((x,k)=>x?.[k],o);return v??fallback}catch{return fallback}},escapeText=s=>String(s??'');
const candidate=o=>{let c=pick(o,['candidates'],[]);while(Array.isArray(c)&&c.length)c=c[0];return isObj(c)?c:{}};
function messagesFor(raw){const prompt=Array.isArray(raw.prompt)?raw.prompt:Array.isArray(raw.messages)?raw.messages:[];return prompt.filter(isObj)}
function contentText(v){if(typeof v==='string')return v;if(Array.isArray(v))return v.map(x=>isObj(x)&&x.type==='text'?text(x.text):text(x)).join('\n');return v==null?'':text(v)}
function norm(raw,index){const pi=pick(raw,['meta','private_info'],{}),ex=pi.extra||{},c=candidate(raw),content=c.content,msgs=messagesFor(raw);const question=ex.question??raw.question??raw.prompt??'';const ref=ex.reference_answer??raw.reference_answer??null,final=ex.final_answer??raw.final_answer??null,correct=typeof ex.correct==='boolean'?ex.correct:null;const contentOut=contentText(content);const init=ex.init_image??raw.init_image??'';const hay=[raw.data_id,raw.category,question,ref,final,ex.type,ex.subtype].map(text).join(' ').toLowerCase();return{raw,index,id:text(raw.data_id??ex.id??`记录 ${index+1}`),category:text(raw.category??ex.category??'未分类'),question:text(question),image:text(init),reference:ref,final,correct,reasoning:text(c.reasoning_content??''),content,contentOut,messages:msgs,tools:Array.isArray(raw.tools)?raw.tools:[],labels:Array.isArray(raw.labels)?raw.labels:[],privateInfo:pi,extra:ex,hay}}
function status(n){return n.correct===true?['正确','ok']:n.correct===false?['错误','bad']:['未评测','unknown']}
function directConflict(n){return n.correct===true&&n.reference!=null&&n.final!=null&&String(n.reference).trim()!==String(n.final).trim()}
function setText(el,v){el.textContent=escapeText(v);return el}function el(tag,cls){const x=document.createElement(tag);if(cls)x.className=cls;return x}function fmt(v){try{return JSON.stringify(v,null,2)}catch{return String(v)}}
function parseFile(file){state.records=[];state.filtered=[];state.selected=-1;state.errors=[];state.file=file;$('#fileInfo').textContent=`${file.name}（${(file.size/1024/1024).toFixed(2)} MB）`;$('#loadInfo').textContent='读取中…';return file.text().then(s=>{s.split(/\r?\n/).forEach((line,i)=>{if(i===0)line=line.replace(/^﻿/,'');if(!line.trim())return;try{const raw=JSON.parse(line);if(!isObj(raw))throw Error('顶层不是对象');state.records.push(norm(raw,state.records.length))}catch(err){state.errors.push({line:i+1,msg:err.message})}});$('#sidebar').classList.remove('hidden');$('#loadInfo').textContent=`${state.records.length} 条有效记录${state.errors.length?`，${state.errors.length} 行解析失败`:''}`;populateCategories();applyFilters();if(!state.records.length)renderEmpty('没有可解析的对象记录。',true);else select(state.filtered[0]??-1);});}
function populateCategories(){const sel=$('#category'),old=sel.value;sel.replaceChildren(new Option('全部题型',''));[...new Set(state.records.map(r=>r.category))].sort().forEach(v=>sel.add(new Option(v,v)));sel.value=old}
function applyFilters(){const q=$('#search').value.trim().toLowerCase(),cat=$('#category').value,want=$('#status').value;state.filtered=state.records.filter(r=>(!q||r.hay.includes(q))&&(!cat||r.category===cat)&&(!want||(want==='unknown'?r.correct===null:String(r.correct)===want))).map(r=>r.index);$('#filterInfo').textContent=`显示 ${state.filtered.length} / ${state.records.length} 条记录`;renderList();if(!state.filtered.includes(state.selected)){select(state.filtered[0]??-1)}else renderDetail()}
function renderList(){const box=$('#recordList');box.replaceChildren();const frag=document.createDocumentFragment();state.filtered.forEach(i=>{const r=state.records[i],[label,cls]=status(r),b=el('button',`record${i===state.selected?' active':''}`);b.type='button';b.onclick=()=>select(i);const id=el('div','record-id');setText(id,`#${i+1} ${r.id}`);const meta=el('div','record-meta');setText(meta,r.category);const badge=el('span',`badge ${cls}`);setText(badge,label);meta.append(' ',badge);if(directConflict(r)){const x=el('span','badge conflict');setText(x,'答案冲突');meta.append(' ',x)}b.append(id,meta);frag.append(b)});if(!state.filtered.length){const m=el('p','hint');setText(m,'没有符合当前筛选条件的记录。');frag.append(m)}box.append(frag)}
function select(index){state.selected=index;renderList();renderDetail()}
function renderEmpty(message,showErrors=false){const main=$('#main');main.replaceChildren();const box=el('div','empty');const h=el('h2');setText(h,message);box.append(h);if(showErrors&&state.errors.length){const p=el('p','hint');setText(p,`解析失败的行：${state.errors.slice(0,8).map(x=>`${x.line}（${x.msg}）`).join('；')}${state.errors.length>8?'…':''}`);box.append(p)}main.append(box)}
function addPre(parent,value){const pre=el('pre');setText(pre,typeof value==='string'?value:fmt(value));parent.append(pre)}
function addAnswer(parent,title,value){const box=el('div','answer'),h=el('h4');setText(h,title);const v=el('div','answer-text');setText(v,value==null?'—':text(value));box.append(h,v);parent.append(box)}
function addDetails(parent,title,value,open=false){const d=el('details','details');d.open=open;const s=el('summary');setText(s,title);d.append(s);addPre(d,value);parent.append(d)}
function renderImage(container,r){if(!r.image||r.image==='—'){const f=el('div','image-fallback hint');setText(f,'未提供题目图片 URL。');container.append(f);return}let u;try{u=new URL(r.image)}catch{u=null}if(!u||u.protocol!=='https:'){const f=el('div','image-fallback');setText(f,`图片 URL 不可加载（仅自动加载 HTTPS）：${r.image}`);container.append(f);return}const img=new Image();img.alt=`题目图片：${r.id}`;img.referrerPolicy='no-referrer';const loading=el('div','hint');setText(loading,'正在加载题目图片…');container.append(loading);img.onload=()=>{container.replaceChildren(img)};img.onerror=()=>{container.replaceChildren();const f=el('div','image-fallback');setText(f,`图片加载失败。URL：${r.image}`);const a=el('a','image-link');a.href=r.image;a.target='_blank';a.rel='noreferrer';setText(a,'在新标签页打开图片');f.append(document.createElement('br'),a);container.append(f)};img.src=u.href}
function renderTools(parent,tools){if(!tools.length){const p=el('p','hint');setText(p,'未提供工具定义。');parent.append(p);return}tools.forEach((t,i)=>{const wrap=el('div','tool'),fn=t?.function||t||{},name=el('div','tool-name');setText(name,fn.name||`工具 ${i+1}`);const desc=el('div','hint');setText(desc,fn.description||'未提供说明');wrap.append(name,desc);if(fn.parameters!=null)addPre(wrap,fn.parameters);else if(!fn.name)addPre(wrap,t);parent.append(wrap)})}
function roleName(value){const role=String(value||'assistant').toLowerCase();return ['system','user','assistant','tool'].includes(role)?role:'assistant'}
function renderMessage(parent,msg,index,label){const role=roleName(msg.role),card=el('details',`message ${role}`);card.open=role==='user';const head=el('summary','message-head'),badge=el('span',`role ${role}`),step=el('span','step');setText(badge,role.toUpperCase());setText(step,`#${index}`);head.append(badge,step);if(label!==undefined){const mark=el('span',`badge msg-label ${label?'ok':'unknown'}`);setText(mark,`label=${text(label)}`);head.append(mark)}card.append(head);const body=el('div','message-body');const content=msg.content;if(content!=null){const block=el('div','block');setText(block,contentText(content));body.append(block)}else{const block=el('div','hint');setText(block,'未提供 content。');body.append(block)}if(msg.reasoning_content){const d=el('details'),s=el('summary');setText(s,`💭 思考过程（${String(msg.reasoning_content).length} 字符）`);d.append(s);addPre(d,msg.reasoning_content);body.append(d)}if(Array.isArray(msg.tool_calls)&&msg.tool_calls.length){const d=el('details'),s=el('summary');setText(s,`🔧 工具调用（${msg.tool_calls.length}）`);d.append(s);addPre(d,msg.tool_calls);body.append(d)}card.append(body);parent.append(card)}
function renderConversation(parent,r){const controls=el('div','conversation-controls'),roleLabel=el('label');setText(roleLabel,'角色');const select=el('select'),all=new Option('全部','');select.append(all);['system','user','assistant','tool'].forEach(v=>select.add(new Option(v.toUpperCase(),v)));const onlyLabel=el('input');onlyLabel.type='checkbox';onlyLabel.id='onlyLabel';const lab=el('label');lab.htmlFor='onlyLabel';setText(lab,'仅显示带 label 的步骤');const expand=el('button','btn'),collapse=el('button','btn'),count=el('span','stat');expand.type=collapse.type='button';setText(expand,'展开全部');setText(collapse,'收起全部');controls.append(roleLabel,select,onlyLabel,lab,expand,collapse,count);const list=el('div');const refresh=()=>{list.replaceChildren();let shown=0;r.messages.forEach((m,i)=>{const value=r.labels[i];if(select.value&&roleName(m.role)!==select.value)return;if(onlyLabel.checked&&value===undefined)return;renderMessage(list,m,i,value);shown++});setText(count,`显示 ${shown} / ${r.messages.length} 条消息`)};select.onchange=onlyLabel.onchange=refresh;expand.onclick=()=>list.querySelectorAll('details').forEach(x=>x.open=true);collapse.onclick=()=>list.querySelectorAll('details').forEach(x=>x.open=false);refresh();parent.append(controls,list)}
function makeTask(r){const task=el('section','section'),th=el('h3','section-title');setText(th,'题目与图片');const tb=el('div','body task-grid'),qa=el('div'),qh=el('h4');setText(qh,'题目');const qt=el('div','question');setText(qt,r.question);qa.append(qh,qt);const pic=el('div'),ph=el('h4');setText(ph,'题目图片');const iw=el('div','image-wrap');renderImage(iw,r);pic.append(ph,iw);if(r.image&&r.image!=='—'){const link=el('a','image-link');link.href=r.image;link.target='_blank';link.rel='noreferrer';setText(link,'在新标签页打开图片');pic.append(link)}tb.append(qa,pic);task.append(th,tb);return task}
function makeAnswers(r){const ans=el('section','section'),ah=el('h3','section-title');setText(ah,'答案与评测');const ab=el('div','body answers');addAnswer(ab,'参考答案',r.reference);addAnswer(ab,'模型最终答案',r.final);ans.append(ah,ab);return ans}
function makeCandidate(r){const wrap=el('div');const title=el('h3','section-title');setText(title,'候选答案（1）');wrap.append(title);const answer=el('section','section');addDetails(answer,'模型面向用户的最终回答',r.content??'未提供',true);const reasoning=el('section','section');addDetails(reasoning,`💭 思考过程（${r.reasoning==='—'?0:r.reasoning.length} 字符）`,r.reasoning,false);wrap.append(answer,reasoning,makeAnswers(r));return wrap}
function makeMeta(r){const wrap=el('div'),section=el('section','section'),title=el('h3','section-title');setText(title,'Meta / 原始');const md=el('details','details'),ms=el('summary');setText(ms,'展开元数据');const mb=el('div','body');const keys=['sample_id','source_dataset','source_version','task_type','domain','input_language','output_language','input_modalities','tokens','num_assistant_turns','num_tool_calls','harness','generator_model'];const dl=el('dl','kv');keys.forEach(k=>{if(r.privateInfo[k]!==undefined){const dt=el('dt'),dd=el('dd');setText(dt,k);setText(dd,text(r.privateInfo[k]));dl.append(dt,dd)}});mb.append(dl);addDetails(mb,'额外元数据（extra）',r.extra,false);md.append(ms,mb);const raw=el('details','details'),raws=el('summary');setText(raws,'展开 Raw JSON');raw.append(raws);addPre(raw,r.raw);section.append(title,md,raw);wrap.append(section);return wrap}
function makeTools(r){const wrap=el('div'),section=el('section','section'),title=el('h3','section-title');setText(title,`工具（${r.tools.length}）`);section.append(title);renderTools(section,r.tools);wrap.append(section);return wrap}
function renderDetail(){if(state.selected<0){renderEmpty('当前筛选条件下没有可显示的记录。');return}const r=state.records[state.selected],main=$('#main');main.replaceChildren();const [label,cls]=status(r),pos=state.filtered.indexOf(r.index);const header=el('div','record-header'),h=el('h2');setText(h,`#${r.index+1} ${r.id}`);const chips=el('div','chips');for(const v of [r.category,`工具 ${r.tools.length}`,`标签 ${r.labels.length}`]){const c=el('span','chip');setText(c,v);chips.append(c)}const b=el('span',`badge ${cls}`);setText(b,label);chips.append(b);if(directConflict(r)){const x=el('span','badge conflict');setText(x,'correct=true，但答案文本不同');chips.append(x)}const nav=el('div','nav'),prev=el('button','btn'),next=el('button','btn'),count=el('span','stat');prev.type=next.type='button';setText(prev,'← 上一条');setText(next,'下一条 →');setText(count,`${pos+1} / ${state.filtered.length}`);prev.disabled=pos<=0;next.disabled=pos<0||pos>=state.filtered.length-1;prev.onclick=()=>select(state.filtered[pos-1]);next.onclick=()=>select(state.filtered[pos+1]);nav.append(prev,count,next);header.append(h,chips,nav);main.append(header);const tabs=el('div','tabs');[['overview','总览'],['conversation','对话'],['candidate','候选答案'],['tools','工具'],['meta','Meta / 原始']].forEach(([key,labelText])=>{const btn=el('button',`tab${state.tab===key?' active':''}`);btn.type='button';setText(btn,labelText+(key==='conversation'?`（${r.messages.length}）`:key==='candidate'?'（1）':key==='tools'?`（${r.tools.length}）`:''));btn.onclick=()=>{state.tab=key;renderDetail()};tabs.append(btn)});main.append(tabs);const panel=el('div');if(state.tab==='conversation'){const section=el('section','section');renderConversation(section,r);panel.append(section)}else if(state.tab==='candidate')panel.append(makeCandidate(r));else if(state.tab==='tools')panel.append(makeTools(r));else if(state.tab==='meta')panel.append(makeMeta(r));else panel.append(makeTask(r),makeAnswers(r));main.append(panel)}
$('#pick').onclick=()=>$('#file').click();$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)parseFile(f)};['dragenter','dragover'].forEach(type=>document.addEventListener(type,e=>{e.preventDefault();$('#drop')?.classList.add('over')}));['dragleave','drop'].forEach(type=>document.addEventListener(type,e=>{e.preventDefault();$('#drop')?.classList.remove('over');if(type==='drop'&&e.dataTransfer.files[0])parseFile(e.dataTransfer.files[0])}));['search','change'].forEach(type=>{['#search','#category','#status'].forEach(s=>$(s).addEventListener(type,applyFilters))});$('#clear').onclick=()=>{$('#search').value='';$('#category').value='';$('#status').value='';applyFilters()};document.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown'].includes(e.key)||!state.filtered.length)return;const tag=document.activeElement?.tagName;if(['INPUT','SELECT','BUTTON','TEXTAREA'].includes(tag)||String(window.getSelection()).trim())return;const p=state.filtered.indexOf(state.selected),n=e.key==='ArrowUp'?p-1:p+1;if(n>=0&&n<state.filtered.length){e.preventDefault();select(state.filtered[n])}});
</script>
</body>
